<!DOCTYPE html>
<html>

<body>

    <h2>JavaScript Math Object</h2>

    <p id="demo"></p>

    <script>
        let number = 5.7;

        let rounded = Math.round(number);
        let squareRoot = Math.sqrt(25);
        let power = Math.pow(2, 3);

        document.getElementById("demo").innerHTML =
            "Original Number: " + number + "<br>" +
            "Rounded Number: " + rounded + "<br>" +
            "Square Root of 25: " + squareRoot + "<br>" +
            "2 raised to power 3: " + power;
    </script>

</body>

</html>
