<!DOCTYPE html>
<html>

<body>

    <h2>JavaScript Arguments Object</h2>

    <p id="demo"></p>

    <script>
        function addNumbers() {
            let sum = 0;

            for (let i = 0; i < arguments.length; i++) {
                sum = sum + arguments[i];
            }

            return sum;
        }

        let result = addNumbers(10, 20, 30);

        document.getElementById("demo").innerHTML =
            "The sum is: " + result;
    </script>

</body>

</html>
