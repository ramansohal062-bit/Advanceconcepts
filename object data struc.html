<!DOCTYPE html>
<html>

<body>

    <h2>JavaScript Object</h2>

    <p id="demo"></p>

    <script>
        // Creating an object
        let student = {
            name: "Riya",
            age: 10,
            grade: 5
        };

        // Displaying object values
        document.getElementById("demo").innerHTML =
            "Name: " + student.name + "<br>" +
            "Age: " + student.age + "<br>" +
            "Grade: " + student.grade;
    </script>

</body>

</html>
