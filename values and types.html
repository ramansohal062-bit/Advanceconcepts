<!DOCTYPE html>
<html>

<head>
    <title>Values and Types</title>
</head>

<body>

    <h2>JavaScript Values and Types</h2>

    <script>
        let name = "Riya";
        let age = 10;
        let height = 4.5;
        let isStudent = true;

        document.write("Name: " + name + "<br>");
        document.write("Type: " + typeof name + "<br><br>");

        document.write("Age: " + age + "<br>");
        document.write("Type: " + typeof age + "<br><br>");

        document.write("Height: " + height + "<br>");
        document.write("Type: " + typeof height + "<br><br>");

        document.write("Is Student: " + isStudent + "<br>");
        document.write("Type: " + typeof isStudent);
    </script>

</body>

</html>
